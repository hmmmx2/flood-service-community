name: "FloodWatch Backend — CI/CD"

on:
  push:
    branches: [testing]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: "JUnit Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn test -Dspring.profiles.active=integration-test --no-transfer-progress -Dtest="UserIdGeneratorTest,JwtTokenProviderTest,RevokedTokenStoreTest"
        env:
          SPRING_DATASOURCE_URL: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE"
          JWT_SECRET: "ci-placeholder-not-used-profile-overrides-this"
          JWT_REFRESH_SECRET: "ci-placeholder-not-used-profile-overrides-this"
          INGEST_API_KEY: "ci-test-api-key"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3002"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: target/surefire-reports/
          retention-days: 7

  promote:
    name: "Promote to production branch"
    needs: test
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push testing to production branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout production
          git merge testing --ff-only
          git push origin production