name: "FloodWatch Backend — CI/CD"

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "JUnit Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn test -Dspring.profiles.active=integration-test --no-transfer-progress -Dtest="UserIdGeneratorTest,JwtTokenProviderTest,RevokedTokenStoreTest"
        env:
          SPRING_DATASOURCE_URL: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE"
          JWT_SECRET: "ci-placeholder-not-used-profile-overrides-this"
          JWT_REFRESH_SECRET: "ci-placeholder-not-used-profile-overrides-this"
          INGEST_API_KEY: "ci-test-api-key"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3002"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: target/surefire-reports/
          retention-days: 7

  deploy:
    name: "Deploy to Railway (production)"
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Railway redeploy
        run: |
          echo "Triggering Railway production redeploy..."
          curl -s -X POST \
            https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { serviceInstanceRedeploy(environmentId: \"${{ secrets.RAILWAY_ENVIRONMENT_ID }}\", serviceId: \"${{ secrets.RAILWAY_SERVICE_ID }}\") }"
            }'
          echo "Railway redeploy triggered."